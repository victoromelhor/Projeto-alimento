[project]
name = "rede-alimenta-ia"
version = "0.1.0"
description = "Rede Alimenta IA — plataforma de doação de alimentos com IA e DevSecOps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.36.0",
  "httpx>=0.27.0",
  "requests>=2.31.0",
  "pyyaml>=6.0.1",
  "gunicorn>=22.0.0",
  "PyJWT>=2.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "black>=24.4.0",
  "mypy>=1.10.0",
  "bandit>=1.7.8",
  "pre-commit>=3.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
