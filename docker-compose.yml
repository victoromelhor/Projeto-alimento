version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: rede_alimenta_ia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rede_alimenta_ia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: bash -lc "pip install --no-cache-dir -r requirements.txt && uvicorn api.app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/rede_alimenta_ia
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  ml_service:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: bash -lc "pip install --no-cache-dir -r requirements.txt && uvicorn ml_service.app.api:app --host 0.0.0.0 --port 8001 --reload"
    environment:
      APP_ENV: development
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/live').read()\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: bash -lc "pip install --no-cache-dir -r requirements.txt && streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501"
    environment:
      API_BASE_URL: http://api:8000
      ML_SERVICE_URL: http://ml_service:8001
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
      ml_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501').read()\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s

volumes:
  postgres_data:
